name: Build Overdesk Windows Executable (.exe)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub web interface

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Git Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Squared App Icons
        run: npx tsx generate-icons.js

      - name: Build Application dist and server
        run: npm run build

      - name: Build Standalone Windows Executable (.exe)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdesk-FX-Checklist-Setup
          path: dist-electron/*.exe
          retention-days: 14
